name: ounje_mi
description: Recettes illustrées et menus hebdomadaires selon les aliments choisis.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  http: ^1.6.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/recipes.json
    - assets/data/import-report.json
    - assets/photos/
